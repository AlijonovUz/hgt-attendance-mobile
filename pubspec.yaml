name: hgt_attendance_mobile
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  # Offline yuz reference’i — CachedNetworkImage bilan bir xil kesh (URL kalit).
  flutter_cache_manager: ^3.4.1
  gap: ^3.0.1
  intl: ^0.20.2
  flutter_gen: ^5.14.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.3.0
  shimmer: ^3.0.0
  dio: ^5.9.2
  web_socket_channel: ^3.0.3
  flutter_screenutil: ^5.9.3
  permission_handler: ^12.0.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  image_picker: ^1.1.2
  geolocator: ^13.0.0
  flutter_native_splash: ^2.4.7
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  change_app_package_name: ^1.5.0
  vpn_connection_detector: ^2.0.3
  path_provider: ^2.1.5
  connectivity_plus: ^7.1.1
  crypto: ^3.0.6
  tflite_flutter: ^0.11.0
  flutter_secure_storage: ^9.2.4
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_gen_runner: ^5.14.1
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  thunder: ^0.2.5
  flutter_launcher_icons: ^0.14.4

flutter_gen:
  output: lib/core/gen/

  integrations:
    image: true
    flutter_svg: true
    lottie: true

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  # ── Inter (Figma `family/sans`) — lokal statik fontlar (18pt optik o‘lcham).
  # Manrope’dan voz kechildi. Barcha matn shu oila orqali (ThemeData.fontFamily
  # + text_extensions defaulti) chiqadi.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic

# ── Native splash (flutter_native_splash) ───────────────────────────────────
# Minimal OS splash: solid brand color only (light + dark), no logo. Android
# 12+ cannot render a full background image natively, so the native frame is
# kept a plain color and the Flutter SplashPage owns the full branded visual
# (background image + tinted logo + animated «Davomat» wordmark). The colors
# match the SplashPage base so the native → Flutter handoff is seamless.
# Regenerate after edits with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#D6E6FB"
  color_dark: "#0A0A0A"
  android: true
  ios: true
  web: false
  android_12:
    color: "#D6E6FB"
    color_dark: "#0A0A0A"
