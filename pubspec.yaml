name: hgt_attendance_mobile
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  gap: ^3.0.1
  intl: ^0.20.2
  flutter_gen: ^5.14.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.3.0
  shimmer: ^3.0.0
  dio: ^5.9.2
  flutter_screenutil: ^5.9.3
  permission_handler: ^12.0.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  logger: ^2.7.0
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_gen_runner: ^5.14.1
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  thunder: ^0.2.5

flutter_gen:
  output: lib/core/gen/

  integrations:
    image: true
    flutter_svg: true
    lottie: true

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
