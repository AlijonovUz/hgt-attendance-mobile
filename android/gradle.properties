# Gradle daemon heap. This machine has little free commit (Windows error 1455:
# "paging file too small"), so keep the footprint small: 1.5G heap, SerialGC
# (smaller virtual reservation than G1). Metaspace raised to 1g — release lint +
# R8 load thousands of classes and 512m hit "OutOfMemoryError: Metaspace".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
# camera_android_camerax generates Java 11 nestmate bytecode; the isolated
# DexingNoClasspathTransform can't see nest siblings (D8: "requires its nest
# mates ... to be on program or class path"). Force full-classpath dexing.
android.useFullClasspathForDexingTransform=true
